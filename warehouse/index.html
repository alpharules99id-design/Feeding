<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PR WHS - SmartDairy V06 Harian</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --navy:#0f172a;
      --green:#10b981;
      --blue:#38bdf8;
      --electric:#00e5ff;
      --electric2:#7c3aed;
      --bg:#f8fafc;
      --dark:#111827;
      --border:#d7e3f0;
      --danger:#ef4444;
      --warning:#f59e0b;
    }

    * {
      box-sizing: border-box;
      font-family: "Courier New", Courier, monospace !important;
    }

    body {
      margin:0;
      background:
        radial-gradient(circle at 20% 0%, rgba(0,229,255,.10), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(124,58,237,.08), transparent 30%),
        var(--bg);
      color:var(--dark);
      min-height:100vh;
    }

    .app-header {
      background: var(--navy);
      color:white;
      padding: 22px 16px;
      position:sticky;
      top:0;
      z-index:20;
      box-shadow:0 6px 22px rgba(15,23,42,.22);
    }

    .header-inner {
      max-width:520px;
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .brand {
      display:flex;
      gap:10px;
      align-items:center;
      line-height:1.1;
    }

    .brand-icon {
      width:38px;
      height:38px;
      border-radius:15px;
      background:linear-gradient(135deg, var(--green), #047857);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 0 18px rgba(16,185,129,.55);
    }

    .brand-title {
      font-weight:900;
      font-size:20px;
      letter-spacing:-1px;
    }

    .brand-sub {
      color:#94a3b8;
      font-size:11px;
      margin-top:2px;
    }

    .date-pill {
      border:1px solid rgba(255,255,255,.35);
      color:#22c55e;
      padding:7px 14px;
      border-radius:999px;
      font-size:12px;
      background:rgba(255,255,255,.05);
    }

    .wrap {
      max-width:520px;
      margin:18px auto 34px;
      padding:0 14px 32px;
    }

    .status {
      border-radius:18px;
      padding:13px 16px;
      margin-bottom:16px;
      font-size:13px;
      border:1px solid #bbf7d0;
      color:#065f46;
      background:#dcfce7;
      display:flex;
      gap:8px;
      align-items:center;
      box-shadow:0 7px 20px rgba(16,185,129,.12);
    }

    .card-main {
      background:white;
      border-radius:24px;
      border:1px solid #e2e8f0;
      padding:20px;
      box-shadow:0 16px 38px rgba(15,23,42,.08);
      position:relative;
      overflow:hidden;
    }

    .card-main::before {
      content:"";
      position:absolute;
      inset:-2px;
      border-radius:26px;
      padding:2px;
      background:linear-gradient(120deg, transparent, rgba(0,229,255,.9), transparent, rgba(124,58,237,.6), transparent);
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      animation:electricBorder 2.8s linear infinite;
      pointer-events:none;
    }

    @keyframes electricBorder {
      0% { filter:hue-rotate(0deg); opacity:.45; }
      50% { filter:hue-rotate(80deg); opacity:1; }
      100% { filter:hue-rotate(0deg); opacity:.45; }
    }

    .section-title {
      font-weight:900;
      font-size:18px;
      color:#0f172a;
      margin-bottom:20px;
      display:flex;
      align-items:center;
      gap:8px;
    }

    label {
      font-size:12px;
      font-weight:900;
      color:#475569;
      text-transform:uppercase;
      margin-bottom:8px;
    }

    .electric-field {
      width:100%;
      border:1.6px solid var(--border);
      border-radius:16px;
      padding:14px 14px;
      font-weight:900;
      background:#fff;
      outline:none;
      transition:.25s;
      min-height:52px;
      box-shadow: inset 0 0 0 rgba(0,229,255,0);
    }

    .electric-field:focus {
      border-color:var(--electric);
      box-shadow:
        0 0 0 4px rgba(0,229,255,.15),
        0 0 22px rgba(0,229,255,.35),
        inset 0 0 14px rgba(0,229,255,.08);
      animation:electricPulse 1.1s infinite alternate;
    }

    @keyframes electricPulse {
      from { box-shadow:0 0 0 4px rgba(0,229,255,.12), 0 0 15px rgba(0,229,255,.25), inset 0 0 9px rgba(0,229,255,.06); }
      to { box-shadow:0 0 0 4px rgba(124,58,237,.12), 0 0 26px rgba(0,229,255,.55), inset 0 0 18px rgba(124,58,237,.08); }
    }

    .input-group .electric-field {
      border-radius:16px 0 0 16px;
      font-size:24px;
      color:#047857;
    }

    .input-group-text {
      border-radius:0 16px 16px 0;
      font-weight:900;
      border:1.6px solid var(--border);
      background:#f8fafc;
    }

    .target-box {
      display:none;
      background:#f8fafc;
      border-radius:18px;
      border-left:5px solid #3b82f6;
      padding:15px;
      margin-bottom:16px;
    }

    .target-num {
      font-size:28px;
      font-weight:900;
      color:#0f172a;
    }

    .btn-main {
      width:100%;
      border:0;
      border-radius:16px;
      padding:15px;
      font-weight:900;
      background:linear-gradient(135deg,#10b981,#059669);
      color:white;
      box-shadow:0 10px 24px rgba(16,185,129,.25);
      text-transform:uppercase;
    }

    .btn-main:disabled {
      background:#94a3b8;
      box-shadow:none;
    }

    .btn-light2 {
      width:100%;
      margin-top:10px;
      border:1px solid var(--border);
      border-radius:16px;
      padding:12px;
      background:white;
      font-weight:900;
      color:#0f172a;
    }

    .history-head {
      margin:20px 4px 9px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      color:#475569;
      font-weight:900;
      font-size:12px;
      text-transform:uppercase;
    }

    .count-pill {
      border:1px solid #cbd5e1;
      background:white;
      border-radius:999px;
      padding:4px 10px;
      color:#0f172a;
    }

    .recent-item {
      background:white;
      border:1px solid #e2e8f0;
      border-radius:16px;
      padding:14px;
      margin-bottom:10px;
      box-shadow:0 6px 18px rgba(15,23,42,.06);
    }

    .badge-soft {
      display:inline-block;
      padding:4px 8px;
      border-radius:999px;
      font-size:10px;
      font-weight:900;
      background:#0f172a;
      color:white;
      margin-bottom:5px;
    }

    .empty {
      text-align:center;
      color:#64748b;
      background:white;
      border:1px solid #e2e8f0;
      border-radius:16px;
      padding:26px 10px;
      font-size:12px;
    }

    .toastx {
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%);
      width:min(92%,520px);
      padding:15px 16px;
      border-radius:15px;
      color:white;
      font-weight:900;
      z-index:50;
      display:none;
      box-shadow:0 14px 30px rgba(15,23,42,.22);
    }

    .toastx.success { background:#059669; }
    .toastx.error { background:#dc2626; }
    .toastx.info { background:#0f172a; }

    .loading {
      position:fixed;
      inset:0;
      background:rgba(248,250,252,.75);
      backdrop-filter: blur(4px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:40;
    }

    .loader {
      width:52px;
      height:52px;
      border-radius:50%;
      border:4px solid #cbd5e1;
      border-top-color:var(--electric);
      animation:spin .8s linear infinite;
      box-shadow:0 0 22px rgba(0,229,255,.55);
    }

    @keyframes spin { to { transform:rotate(360deg); } }

    .sub-area {
      display:none;
    }

    .alasan-area {
      display:none;
    }

    .small-note {
      font-size:11px;
      color:#64748b;
      margin-top:6px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon"><i class="bi bi-cloud-check-fill"></i></div>
        <div>
          <div class="brand-title">PR WHS</div>
          <div class="brand-sub">Purchase Request Gudang</div>
        </div>
      </div>
      <div class="date-pill" id="current-date">-</div>
    </div>
  </header>

  <main class="wrap">
    <div class="status" id="statusBox">
      <i class="bi bi-wifi"></i>
      <span id="statusText">Online - siap sinkron ke Spreadsheet</span>
    </div>

    <section class="card-main">
      <div class="section-title">
        <i class="bi bi-plus-circle-fill text-primary"></i>
        Input Purchase Request WHS
      </div>

      <div class="mb-3">
        <label>Urutan Pengiriman</label>
        <select id="batch-select" class="electric-field">
          <option value="Batch 1">🚚 Batch 1</option>
          <option value="Batch 2">🚚 Batch 2</option>
          <option value="Batch 3">🚚 Batch 3</option>
          <option value="Batch 4">🚚 Batch 4</option>
          <option value="Harian">📝 Harian</option>
        </select>
      </div>

      <div class="mb-3">
        <label>Pilih Bahan Request</label>
        <select id="bahan-select" class="electric-field">
          <option value="" selected disabled>Memuat data pakan...</option>
        </select>
        <div class="small-note">Batch 1-4: hanya bahan yang ada tonase. Harian: semua bahan tanpa tonase.</div>
      </div>

      <div class="mb-3 sub-area" id="substitute-dropdown-area">
        <label style="color:#b45309;">Pilih Bahan Substitusi</label>
        <select id="substitute-select" class="electric-field">
          <option value="" selected disabled>-- Pilih Bahan Pengganti --</option>
        </select>
      </div>

      <div class="mb-3 alasan-area" id="alasan-area">
        <label>Alasan Substitusi</label>
        <select id="alasan-select" class="electric-field">
          <option value="">-- Pilih Alasan --</option>
          <option value="Stok bahan request kosong">Stok bahan request kosong</option>
          <option value="Stok bahan request kurang">Stok bahan request kurang</option>
          <option value="Kualitas bahan tidak sesuai">Kualitas bahan tidak sesuai</option>
          <option value="Arahan atasan / nutrisi">Arahan atasan / nutrisi</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>

      <div class="target-box" id="tonnage-area">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="small text-muted fw-bold text-uppercase">Target Sheet</div>
            <span class="target-num" id="target-weight">0</span>
            <span class="fw-bold text-muted">kg</span>
          </div>
          <span class="badge rounded-pill bg-light text-dark border" id="substitute-badge" style="display:none;">Substitusi</span>
        </div>
      </div>

      <div class="mb-3">
        <label>Aktual Timbangan (KG)</label>
        <div class="input-group">
          <input type="number" id="actual-input" class="electric-field" placeholder="0" min="0" disabled>
          <span class="input-group-text">KG</span>
        </div>
      </div>

      <button id="submit-btn" class="btn-main" disabled>
        <i class="bi bi-cloud-upload-fill me-2"></i> Kirim PR ke Spreadsheet
      </button>
      <button class="btn-light2" id="refresh-btn" type="button">
        <i class="bi bi-arrow-clockwise me-1"></i> Refresh Data
      </button>
    </section>

    <div class="history-head">
      <span>Riwayat Pengiriman Hari Ini</span>
      <span class="count-pill" id="log-count">0 Baris</span>
    </div>
    <div id="activity-log">
      <div class="empty">Belum ada bahan yang dikirim ke sheet.</div>
    </div>
  </main>

  <div class="loading" id="loading-screen"><div class="loader"></div></div>
  <div class="toastx" id="toastBox"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwgpqKWtMeHPXgkfshFK_euA-sMq2T5uFFc_BKwURfIIxQL5Iw7tEnoClPFSlW6ejM6/exec";

    let dataBahan = [];
    let selectedRequest = null;
    let selectedFinal = null;
    let isModeSubstitusi = false;

    const $ = (id) => document.getElementById(id);

    window.addEventListener("load", () => {
      $("current-date").innerText = new Date().toLocaleDateString("id-ID", {
        day:"numeric", month:"short", year:"numeric"
      });

      bindEvents();
      updateOnlineStatus();
      muatSemuaData();

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").then(reg => {
          reg.update();
        }).catch(() => {});
      }
    });

    window.addEventListener("online", updateOnlineStatus);
    window.addEventListener("offline", updateOnlineStatus);

    function bindEvents() {
      $("batch-select").addEventListener("change", onBatchChanged);
      $("bahan-select").addEventListener("change", onBahanMainSelected);
      $("substitute-select").addEventListener("change", onBahanSubstituteSelected);
      $("actual-input").addEventListener("input", updateSubmitState);
      $("submit-btn").addEventListener("click", prosesSimpan);
      $("refresh-btn").addEventListener("click", muatSemuaData);
    }

    function updateOnlineStatus() {
      if (navigator.onLine) {
        $("statusBox").style.background = "#dcfce7";
        $("statusBox").style.color = "#065f46";
        $("statusText").innerText = "Online - siap sinkron ke Spreadsheet";
      } else {
        $("statusBox").style.background = "#fee2e2";
        $("statusBox").style.color = "#991b1b";
        $("statusText").innerText = "Offline - koneksi terputus";
      }
    }

    async function muatSemuaData() {
      showLoading(true);
      try {
        await Promise.all([muatDataDariSheet(), muatHistoryHariIni()]);
      } finally {
        showLoading(false);
      }
    }

    async function muatDataDariSheet() {
      try {
        const res = await fetch(API_URL + "?action=data&t=" + Date.now(), {
          method: "GET",
          cache: "no-store"
        });

        if (!res.ok) throw new Error("HTTP " + res.status);

        const data = await res.json();

        if (!Array.isArray(data)) {
          throw new Error(data.message || "Format data tidak valid");
        }

        dataBahan = data;
        initDropdowns();
      } catch (err) {
        console.error(err);
        showToast("Gagal mengambil data dari Google Sheets: " + err.message, "error");
      }
    }

    async function muatHistoryHariIni() {
      try {
        const res = await fetch(API_URL + "?action=history&t=" + Date.now(), {
          method: "GET",
          cache: "no-store"
        });

        if (!res.ok) throw new Error("HTTP " + res.status);

        const data = await res.json();

        if (!Array.isArray(data)) {
          throw new Error(data.message || "Format history tidak valid");
        }

        renderHistory(data);
      } catch (err) {
        console.error(err);
        showToast("Gagal mengambil history Log_Gudang: " + err.message, "error");
      }
    }

    function initDropdowns() {
      const mainSelect = $("bahan-select");
      const subSelect = $("substitute-select");
      const batchVal = $("batch-select").value;
      const isHarian = batchVal === "Harian";

      mainSelect.innerHTML = '<option value="" selected disabled>-- Pilih Bahan Request --</option>';
      subSelect.innerHTML = '<option value="" selected disabled>-- Pilih Bahan Pengganti --</option>';

      dataBahan.forEach((item, index) => {
        const targetKg = Number(item.target || 0);

        // Mode Harian: tampilkan SEMUA bahan, tanpa teks tonase
        if (isHarian) {
          const optMain = document.createElement("option");
          optMain.value = index;
          optMain.innerHTML = `📦 ${item.name}`;
          mainSelect.appendChild(optMain);
          return;
        }

        // Mode Batch 1-4: dropdown request hanya bahan yang ada tonase
        if (targetKg > 0) {
          const optMain = document.createElement("option");
          optMain.value = index;
          optMain.innerHTML = `📦 ${item.name} (${targetKg} kg)`;
          mainSelect.appendChild(optMain);
        }

        // Mode Batch 1-4: dropdown substitusi hanya bahan yang tidak ada tonase
        if (targetKg <= 0) {
          const optSub = document.createElement("option");
          optSub.value = index;
          optSub.innerHTML = `🔄 ${item.name}`;
          subSelect.appendChild(optSub);
        }
      });

      if (!isHarian) {
        const trigger = document.createElement("option");
        trigger.value = "TRIGGER_SUBSTITUSI";
        trigger.innerHTML = "⚡ [ SUBSTITUSI BAHAN ]";
        mainSelect.appendChild(trigger);
      }

      // Reset tampilan ketika dropdown dibangun ulang
      $("substitute-dropdown-area").style.display = "none";
      $("alasan-area").style.display = "none";
      $("tonnage-area").style.display = "none";
      resetInput();
      selectedRequest = null;
      selectedFinal = null;
      isModeSubstitusi = false;
    }

    function onBatchChanged() {
      initDropdowns();

      if ($("batch-select").value === "Harian") {
        showToast("Mode Harian aktif: semua bahan muncul tanpa tonase.", "info");
      }
    }

    function onBahanMainSelected() {
      const val = $("bahan-select").value;
      const isHarian = $("batch-select").value === "Harian";
      resetInput();

      if (val === "TRIGGER_SUBSTITUSI") {
        isModeSubstitusi = true;
        selectedRequest = null;
        selectedFinal = null;
        $("substitute-dropdown-area").style.display = "block";
        $("alasan-area").style.display = "block";
        $("tonnage-area").style.display = "none";
        $("substitute-select").value = "";
        return;
      }

      isModeSubstitusi = false;
      selectedRequest = dataBahan[Number(val)];
      selectedFinal = selectedRequest;

      $("substitute-dropdown-area").style.display = "none";
      $("alasan-area").style.display = "none";

      if (isHarian) {
        // Harian untuk timbang manual: tidak tampilkan target tonase
        $("tonnage-area").style.display = "none";
      } else {
        $("tonnage-area").style.display = "block";
        $("target-weight").innerText = selectedFinal.target;
        $("substitute-badge").style.display = "none";
        $("tonnage-area").style.borderLeftColor = "#3b82f6";
      }

      $("actual-input").disabled = false;
      $("actual-input").focus();
      updateSubmitState();
    }

    function onBahanSubstituteSelected() {
      const val = $("substitute-select").value;
      if (val === "") return;

      selectedFinal = dataBahan[Number(val)];

      $("tonnage-area").style.display = "block";
      $("target-weight").innerText = 0;
      $("substitute-badge").style.display = "inline-block";
      $("substitute-badge").className = "badge rounded-pill bg-warning text-dark";
      $("substitute-badge").innerText = "Substitusi Aktif";
      $("tonnage-area").style.borderLeftColor = "#f59e0b";
      $("actual-input").disabled = false;
      $("actual-input").focus();
      updateSubmitState();
    }

    function resetInput() {
      $("actual-input").value = "";
      $("actual-input").disabled = true;
      $("submit-btn").disabled = true;
    }

    function updateSubmitState() {
      const actual = Number($("actual-input").value || 0);
      const bahanOk = !!selectedFinal;
      $("submit-btn").disabled = !(bahanOk && actual > 0);
    }

    async function prosesSimpan() {
      const actualVal = Number($("actual-input").value || 0);
      if (!selectedFinal || actualVal <= 0) {
        showToast("Pilih bahan dan isi aktual KG terlebih dahulu.", "error");
        return;
      }

      const payload = {
        batch: $("batch-select").value,
        namaBahan: selectedFinal.name,
        targetAwal: ($("batch-select").value === "Harian" || isModeSubstitusi) ? 0 : Number(selectedFinal.target || 0),
        actualKg: actualVal,
        modeSubstitusi: isModeSubstitusi,
        alasanSubstitusi: isModeSubstitusi ? $("alasan-select").value : ""
      };

      showLoading(true);

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        showToast("Data terkirim. Refresh history dari Log_Gudang...", "success");

        $("actual-input").value = "";
        $("actual-input").disabled = true;
        $("bahan-select").value = "";
        $("substitute-select").value = "";
        $("alasan-select").value = "";
        $("substitute-dropdown-area").style.display = "none";
        $("alasan-area").style.display = "none";
        $("tonnage-area").style.display = "none";
        $("submit-btn").disabled = true;
        selectedFinal = null;
        selectedRequest = null;
        isModeSubstitusi = false;

        setTimeout(async () => {
          await muatHistoryHariIni();
          await muatDataDariSheet();
        }, 900);

      } catch (err) {
        console.error(err);
        showToast("Gagal mengirim data: " + err.message, "error");
      } finally {
        showLoading(false);
      }
    }

    function renderHistory(data) {
      const container = $("activity-log");
      container.innerHTML = "";

      if (!data || data.length === 0) {
        $("log-count").innerText = "0 Baris";
        container.innerHTML = '<div class="empty">Belum ada bahan yang dikirim ke sheet.</div>';
        return;
      }

      data.forEach(item => {
        const sub = String(item.substitusi || "TIDAK").toUpperCase() === "YA";
        const badge = sub ? "Substitusi" : "Sesuai Target";
        const badgeColor = sub ? "#f59e0b" : "#059669";
        const alasan = item.alasan ? `<div class="small text-muted mt-1">Alasan: ${escapeHtml(item.alasan)}</div>` : "";

        const html = `
          <div class="recent-item">
            <div class="d-flex justify-content-between gap-2">
              <div>
                <span class="badge-soft">${escapeHtml(item.batch || "-")}</span>
                <div class="fw-bold">${escapeHtml(item.namaBahan || "-")}</div>
                <div class="small text-muted">${String(item.batch || "") === "Harian" ? "Timbang manual harian" : "Target: " + Number(item.target || 0) + " kg"} • Jam: ${escapeHtml(item.timestamp || "-")}</div>
                ${alasan}
              </div>
              <div class="text-end">
                <div style="background:${badgeColor}; color:white; border-radius:999px; padding:4px 8px; font-size:10px; font-weight:900;">${badge}</div>
                <div class="fs-5 fw-bold text-success mt-2">${Number(item.actual || 0)} <small>kg</small></div>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML("beforeend", html);
      });

      $("log-count").innerText = data.length + " Baris";
    }

    function showLoading(show) {
      $("loading-screen").style.display = show ? "flex" : "none";
    }

    function showToast(message, type="info") {
      const box = $("toastBox");
      box.className = "toastx " + type;
      box.innerText = message;
      box.style.display = "block";
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => box.style.display = "none", 4200);
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, function(m) {
        return ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        })[m];
      });
    }
  </script>
</body>
</html>
