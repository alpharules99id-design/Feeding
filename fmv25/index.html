<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeding Manual - Dairy Farm System</title>
    
    <link class="pwa-meta" rel="manifest" href="manifest.json?v=24">
    <meta name="theme-color" content="#0f2d1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link class="pwa-meta" rel="apple-touch-icon" href="icons/icon-512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1e15; -webkit-tap-highlight-color: transparent; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* ========================================================
           EFEK LISTRIK NEON KUSTOM (ELECTRIC GLOW ANIMATION)
        ======================================================== */
        @keyframes electric-glow {
            0%, 100% {
                border-color: rgba(16, 185, 129, 0.35);
                box-shadow: 0 0 6px rgba(16, 185, 129, 0.2), inset 0 0 2px rgba(16, 185, 129, 0.1);
            }
            50% {
                border-color: rgba(52, 211, 153, 0.75);
                box-shadow: 0 0 14px rgba(52, 211, 153, 0.45), inset 0 0 4px rgba(52, 211, 153, 0.15);
            }
        }

        .electric-box {
            position: relative;
            border: 2px solid rgba(16, 185, 129, 0.35);
            animation: electric-glow 3s infinite ease-in-out;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .electric-box:focus-within, .electric-box-focus:focus {
            animation: none !important;
            border-color: #34d399 !important;
            box-shadow: 0 0 18px rgba(52, 211, 153, 0.75), inset 0 0 6px rgba(52, 211, 153, 0.3) !important;
            transform: scale(1.005);
        }

        .electric-box::before {
            content: '';
            position: absolute;
            top: 0; left: -60%;
            width: 35%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(52, 211, 153, 0.12), transparent);
            transform: skewX(-20deg);
            animation: lightning-pass 5s infinite linear;
            pointer-events: none;
        }

        @keyframes lightning-pass {
            0% { left: -60%; }
            100% { left: 160%; }
        }


        /* ========================================================
           PREMIUM FONT + LOADING 0-100%
        ======================================================== */
        html { background: #04100b; }
        body, body * {
            font-family: 'Courier New', Courier, monospace !important;
        }

        #loading {
            position: fixed !important;
            inset: 0 !important;
            z-index: 99999 !important;
            width: 100vw !important;
            height: 100vh !important;
            background:
                radial-gradient(circle at 50% 72%, rgba(57, 255, 20, 0.22), transparent 26%),
                radial-gradient(circle at 50% 28%, rgba(16, 185, 129, 0.14), transparent 32%),
                linear-gradient(180deg, #03100b 0%, #020806 62%, #000000 100%) !important;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        #loading.hidden { display: none !important; }

        #loading::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(57,255,20,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57,255,20,.045) 1px, transparent 1px);
            background-size: 34px 34px;
            opacity: .45;
            mask-image: linear-gradient(to bottom, transparent, black 22%, black 82%, transparent);
            pointer-events: none;
        }

        #loading::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 16%;
            width: min(82vw, 410px);
            height: 140px;
            transform: translateX(-50%);
            background: radial-gradient(ellipse at center, rgba(57,255,20,.30), rgba(57,255,20,.06) 42%, transparent 70%);
            filter: blur(6px);
            pointer-events: none;
        }

        .loading-panel {
            position: relative;
            z-index: 2;
            width: min(88vw, 390px);
            min-height: min(92vh, 760px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 18px;
        }

        .loading-logo {
            width: min(62vw, 250px);
            max-height: 330px;
            object-fit: contain;
            filter: drop-shadow(0 0 14px rgba(57, 255, 20, .46)) drop-shadow(0 0 28px rgba(16, 185, 129, .22));
            animation: logo-breathe 1.85s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes logo-breathe {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(57,255,20,.40)); }
            50% { transform: scale(1.035); filter: drop-shadow(0 0 24px rgba(57,255,20,.72)); }
        }

        .loading-status {
            margin-top: 26px;
            color: #7CFF4D;
            font-size: clamp(13px, 3.4vw, 18px);
            font-weight: 900;
            letter-spacing: .07em;
            text-shadow: 0 0 12px rgba(57, 255, 20, .58);
        }

        .loading-percent {
            color: #EFFFCA;
            font-size: clamp(22px, 7.2vw, 34px);
            font-weight: 900;
            letter-spacing: .04em;
            line-height: 1;
            text-shadow: 0 0 12px rgba(239, 255, 202, .52);
        }

        .loading-bar {
            width: min(82vw, 380px);
            height: 13px;
            padding: 2px;
            border-radius: 999px;
            background: rgba(57, 255, 20, .12);
            border: 1px solid rgba(124, 255, 77, .25);
            box-shadow: inset 0 0 12px rgba(0,0,0,.8), 0 0 20px rgba(57,255,20,.22);
            overflow: hidden;
        }

        .loading-bar-fill {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #46ff22, #8dff54, #46ff22);
            box-shadow: 0 0 18px rgba(57,255,20,.85), 0 0 32px rgba(57,255,20,.38);
            transition: width .14s linear;
        }

        .loading-version {
            position: absolute;
            bottom: 18px;
            color: rgba(239,255,202,.48);
            font-size: 12px;
            letter-spacing: .18em;
            text-shadow: 0 0 8px rgba(255,255,255,.16);
        }

    </style>
</head>
<body class="font-sans text-gray-200 min-h-screen flex justify-center items-start sm:py-6">

    <div class="w-full max-w-md bg-[#0f2d1e] min-h-screen sm:min-h-[850px] sm:rounded-3xl shadow-2xl p-4 flex flex-col justify-between border border-emerald-900/40 relative">
        <div id="loading" aria-live="polite">
            <div class="loading-panel">
                <img src="assets/logo.png" alt="Feeding Manual" class="loading-logo">
                <div class="loading-status" id="loading-text">MENGHUBUNGKAN KE SPREADSHEET</div>
                <div class="loading-percent" id="loading-percent">0%</div>
                <div class="loading-bar" aria-label="Progress loading">
                    <div class="loading-bar-fill" id="loading-bar-fill"></div>
                </div>
                <div class="loading-version">VER 2.4 CACHE FIX</div>
            </div>
        </div>

        <div class="space-y-4 flex-1">
            <div class="text-center py-1">
                <img src="assets/logo.png" alt="Feeding Manual Logo" class="w-20 h-auto mx-auto mb-2 drop-shadow-[0_0_12px_rgba(52,211,153,0.45)]">
                <h1 class="text-2xl font-black tracking-wider text-white">FEEDING<span class="text-emerald-400">MANUAL</span></h1>
                <p class="text-[10px] uppercase tracking-widest text-emerald-500/80 font-bold mt-0.5">Dairy Farm Feeding System</p>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-emerald-400 uppercase mb-1">Operator</label>
                    <select id="operator" class="electric-box-focus w-full bg-[#163f2b] border border-emerald-700/50 rounded-xl p-3 text-white font-semibold text-xs focus:outline-none transition duration-300">
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-emerald-400 uppercase mb-1">Shift Kerja</label>
                    <select id="shift" onchange="resetSelectionAndRender()" class="electric-box-focus w-full bg-[#163f2b] border border-emerald-700/50 rounded-xl p-3 text-white font-semibold text-xs focus:outline-none transition duration-300">
                        <option value="PAGI">PAGI</option>
                        <option value="SIANG">SIANG</option>
                        <option value="MALAM">MALAM</option>
                    </select>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Pilih Pen / Kandang (Maks 4)</label>
                    <span id="pen-counter" class="text-[10px] bg-emerald-500 text-neutral-900 font-extrabold px-1.5 py-0.5 rounded">0/4</span>
                </div>
                
                <div id="container-pen" class="electric-box bg-[#133624] rounded-xl p-2 max-h-[220px] overflow-y-auto custom-scroll space-y-1.5">
                </div>
            </div>

            <div class="space-y-3 pt-1">
                <label class="block text-[10px] font-bold text-emerald-400 uppercase tracking-wider pl-1">Zonasi Akumulasi Bahan Kering</label>
                <div id="container-bahan" class="space-y-3">
                    <p class="text-xs text-emerald-600 italic text-center py-6">Pilih minimal satu pen di atas untuk memuat target pakan.</p>
                </div>
            </div>
        </div>

        <div class="pt-4 mt-2 border-t border-emerald-900/40">
            <button onclick="kirimTimbangan()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-neutral-950 font-black py-4 rounded-xl shadow-lg transition uppercase tracking-wider text-xs active:scale-[0.99]">
                Simpan & Kirim Timbangan
            </button>
        </div>
    </div>

    <script>

        // ============================================================
        // PWA SERVICE WORKER + LOADING ANIMATION 0-100%
        // ============================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Bersihkan cache versi lama yang sering membuat aplikasi gagal dibuka.
                if (window.caches) {
                    caches.keys().then(keys => {
                        keys.forEach(key => {
                            if (key !== 'feeding-manual-pwa-v25-no-html-cache') caches.delete(key);
                        });
                    });
                }

                navigator.serviceWorker.register('./service-worker.js?v=25')
                    .then(reg => {
                        reg.update();
                        if (reg.waiting) reg.waiting.postMessage({type: 'SKIP_WAITING'});
                    })
                    .catch(err => console.warn('Service Worker gagal terdaftar:', err));
            });
        }

        let LOADING_TIMER = null;
        let LOADING_VALUE = 0;

        function updateLoadingUI(value) {
            LOADING_VALUE = Math.max(0, Math.min(100, Math.round(value)));
            const percentEl = document.getElementById('loading-percent');
            const barEl = document.getElementById('loading-bar-fill');
            if (percentEl) percentEl.innerText = `${LOADING_VALUE}%`;
            if (barEl) barEl.style.width = `${LOADING_VALUE}%`;
        }

        function showLoading(message = 'MENGHUBUNGKAN KE SPREADSHEET') {
            const loading = document.getElementById('loading');
            const textEl = document.getElementById('loading-text');
            if (!loading) return;
            if (textEl) textEl.innerText = message;
            loading.classList.remove('hidden');
            clearInterval(LOADING_TIMER);
            updateLoadingUI(0);

            LOADING_TIMER = setInterval(() => {
                // Naik cepat di awal, lalu menunggu koneksi asli sampai maksimal 92%.
                if (LOADING_VALUE < 92) {
                    const step = Math.max(1, Math.ceil((92 - LOADING_VALUE) * 0.075));
                    updateLoadingUI(LOADING_VALUE + step);
                }
            }, 95);
        }

        function finishLoading(callback) {
            const loading = document.getElementById('loading');
            clearInterval(LOADING_TIMER);

            const doneTimer = setInterval(() => {
                if (LOADING_VALUE >= 100) {
                    clearInterval(doneTimer);
                    setTimeout(() => {
                        if (loading) loading.classList.add('hidden');
                        if (typeof callback === 'function') callback();
                    }, 320);
                } else {
                    updateLoadingUI(LOADING_VALUE + 4);
                }
            }, 28);
        }

        function loadingFailed(message = 'KONEKSI GAGAL') {
            clearInterval(LOADING_TIMER);
            const textEl = document.getElementById('loading-text');
            if (textEl) textEl.innerText = message;
        }

        // ============================================================
        // ⚠️ PASTE URL WEB APP APPS SCRIPT ANDA DI BAWAH INI (BARIS 117)
        // ============================================================
        const API_URL = "https://script.google.com/macros/s/AKfycbxLgmvjs2qsvZ4BP1MQRy7mWbqPyfXHe6dEXhXkNK2tLThdEi_ISGZlWXBse1p1IjLd_w/exec";

        let MASTER_DATA = {};
        let SELECTED_PENS = [];
        let COUNTER_JOBS = {}; // Melacak jumlah timbangan per pen ("PEN_NAME-SHIFT": total_input)

        // ============================================================
        // MEMBANGUN ULANG STATUS 1x / 2x DARI LOG SPREADSHEET
        // Backend hanya mengirim log hari ini, jadi status otomatis reset besok.
        // Batch ID membuat 1 kali simpan dihitung 1 job walaupun berisi banyak bahan.
        // ============================================================
        function rebuildCounterFromLog() {
            COUNTER_JOBS = {};

            if (!MASTER_DATA.log || MASTER_DATA.log.length === 0) {
                return;
            }

            const uniqueJobs = {};

            MASTER_DATA.log.forEach(item => {
                if (!item.pen || !item.shift) return;

                const jobKey = item.batch_id || `${item.tanggal || ''}|${item.shift}|${item.pen}`;
                if (uniqueJobs[jobKey]) return;
                uniqueJobs[jobKey] = true;

                String(item.pen).split(',').forEach(p => {
                    const penName = p.trim();
                    if (!penName) return;

                    const counterKey = `${penName}-${item.shift}`;
                    COUNTER_JOBS[counterKey] = (COUNTER_JOBS[counterKey] || 0) + 1;
                });
            });

            console.log('COUNTER_JOBS dari spreadsheet:', COUNTER_JOBS);
        }

        window.addEventListener('DOMContentLoaded', () => {
            showLoading('MENGHUBUNGKAN KE SPREADSHEET');
            if(API_URL === "https://script.google.com/macros/s/AKfycbyROmkyFmFYSFTZuKIucinv25wmXM03mFMFJhKE5vya6rgJ5BM9vjmdePfWrUC3vvtwjQ/exec") {
                alert("Peringatan: Anda belum memasukkan URL Google Apps Script pada kode index.html!");
                return;
            }

            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    MASTER_DATA = data;
                    rebuildCounterFromLog();
                    
                    const optSelect = document.getElementById('operator');
                    optSelect.innerHTML = '<option value="" disabled selected>PILIH OPERATOR</option>';
                    data.operators.forEach(op => {
                        optSelect.innerHTML += `<option value="${op}">${op}</option>`;
                    });

                    renderPenList();
                    finishLoading();
                })
                .catch(err => {
                    loadingFailed('KONEKSI GAGAL');
                    alert('Koneksi Gagal! Periksa kembali deployment Web App di spreadsheet Anda.');
                    console.error(err);
                });
        });

        function renderPenList() {
            const container = document.getElementById('container-pen');
            const currentShift = document.getElementById('shift').value;
            container.innerHTML = '';

            if(!MASTER_DATA.pens) return;

            MASTER_DATA.pens.forEach(pn => {
                const key = `${pn}-${currentShift}`;
                const count = COUNTER_JOBS[key] || 0;
                
                let bgClass = 'bg-[#18442e] hover:bg-[#1d5238] border-emerald-600/30';
                let statusLabel = '';
                let isLocked = false;

                // Implementasi Aturan: Maksimal 2 Kali Input Per Pen
                if (count === 1) {
                    bgClass = 'bg-[#1e3d23] border-amber-500/50';
                    statusLabel = '<span class="text-[9px] bg-amber-500 text-neutral-900 font-extrabold px-1.5 py-0.5 rounded ml-2">1x TIMBANG</span>';
                } else if (count >= 2) {
                    bgClass = 'bg-emerald-950/40 opacity-40 border-dashed border-emerald-900';
                    statusLabel = '<span class="text-[9px] bg-emerald-900 text-emerald-400 font-bold px-1.5 py-0.5 rounded ml-2">2x - DONE</span>';
                    isLocked = true; // Kunci total agar helper tidak bisa klik lagi
                }

                const item = `
                    <div id="card-pen-${pn}" class="flex justify-between items-center p-3 rounded-lg border transition select-none ${bgClass} ${isLocked ? 'pointer-events-none' : 'cursor-pointer'}" 
                         onclick="${isLocked ? '' : `togglePenSelection('${pn}')`}">
                        <div class="flex items-center">
                            <span class="font-bold text-xs text-white">${pn}</span>
                            ${statusLabel}
                        </div>
                        <input type="checkbox" id="chk-${pn}" value="${pn}" class="w-4 h-4 rounded accent-emerald-500 pointer-events-none bg-emerald-900" ${SELECTED_PENS.includes(pn) ? 'checked' : ''} ${isLocked ? 'disabled' : ''}>
                    </div>
                `;
                container.innerHTML += item;
            });
        }

        function resetSelectionAndRender() {
            SELECTED_PENS = [];
            document.getElementById('pen-counter').innerText = "0/4";
            renderPenList();
            renderBahanBaku();
        }

        function togglePenSelection(penName) {
            if (SELECTED_PENS.includes(penName)) {
                SELECTED_PENS = SELECTED_PENS.filter(p => p !== penName);
            } else {
                // Aturan A: Maksimal Helper Pilih 4 Pen Gabungan
                if (SELECTED_PENS.length >= 4) {
                    alert('Batas Maksimal Penggabungan: Maksimal 4 Pen!');
                    return;
                }
                SELECTED_PENS.push(penName);
            }

            document.getElementById('pen-counter').innerText = `${SELECTED_PENS.length}/4`;
            renderPenList();
            renderBahanBaku();
        }

        function renderBahanBaku() {
            const currentShift = document.getElementById('shift').value;
            const container = document.getElementById('container-bahan');
            
            if (SELECTED_PENS.length === 0) {
                container.innerHTML = `<p class="text-xs text-emerald-600 italic text-center py-6">Pilih minimal satu pen di atas untuk memuat target pakan.</p>`;
                return;
            }

            let akumulasiBahan = {};

            SELECTED_PENS.forEach(penName => {
                const match = MASTER_DATA.master_pakan.find(item => item.pen === penName && item.shift === currentShift);
                if (match && match.bahan) {
                    match.bahan.forEach(b => {
                        const namaBahanClean = b.nama_bahan.trim().toUpperCase();
                        // Proteksi penyaringan: Sembunyikan Konsentrat dan Molases dari helper
                        if (namaBahanClean === "KONSENTRAT" || namaBahanClean === "MOLASES") {
                            return; 
                        }

                        if (!akumulasiBahan[b.nama_bahan]) {
                            akumulasiBahan[b.nama_bahan] = 0;
                        }
                        akumulasiBahan[b.nama_bahan] += b.target_bobot;
                    });
                }
            });

            container.innerHTML = '';
            const keys = Object.keys(akumulasiBahan);

            if (keys.length === 0) {
                container.innerHTML = `<p class="text-xs text-amber-500 font-bold text-center py-6">Tidak ada formula pakan lapangan untuk pen & shift ini.</p>`;
                return;
            }

            keys.forEach((namaBahan, index) => {
                const targetAkhir = akumulasiBahan[namaBahan]; // Murni tonase ikut data asal spreadsheet

                const card = `
                    <div class="electric-box bg-[#12422c] rounded-2xl p-4 text-center shadow-lg relative">
                        <div class="absolute top-3 left-4 bg-emerald-950 px-2 py-0.5 rounded text-[9px] font-bold text-emerald-400">BAHAN ${index + 1}</div>
                        <div class="text-[11px] uppercase tracking-wider text-emerald-300 font-bold mt-1">${namaBahan}</div>
                        <div class="text-3xl font-black my-1 text-white">${targetAkhir.toFixed(1)} <span class="text-xs font-normal text-emerald-400">KG</span></div> 
                        <div class="mt-2 relative z-10">
                            <input type="number" data-bahan="${namaBahan}" data-target="${targetAkhir}" placeholder="INPUT REALISASI TIMBANGAN (KG)" 
                                   class="input-aktual w-full p-2.5 text-center text-gray-900 font-black text-md rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-amber-400 placeholder-gray-400">
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function kirimTimbangan() {
            const operator = document.getElementById('operator').value;
            const shift = document.getElementById('shift').value;
            const inputElements = document.querySelectorAll('.input-aktual');

            if (!operator) {
                alert('Pilih nama operator helper terlebih dahulu!');
                return;
            }
            if (SELECTED_PENS.length === 0) {
                alert('Anda belum mencentang pen/kandang mana pun!');
                return;
            }

            let payload = [];
            let isFormValid = true;

            inputElements.forEach(input => {
                const nilaiAktual = input.value;
                if (!nilaiAktual) {
                    isFormValid = false;
                }
                payload.push({
                    operator: operator,
                    shift: shift,
                    pen: SELECTED_PENS.join(', '), 
                    nama_bahan: input.getAttribute('data-bahan'),
                    target: parseFloat(input.getAttribute('data-target')),
                    aktual: parseFloat(nilaiAktual),
                    persentase: "100%" // Otomatis terisi 100% karena persentase dihilangkan dari UI
                });
            });

            if (!isFormValid || payload.length === 0) {
                alert('Gagal Simpan! Harap isi seluruh kolom aktual pakan hasil timbangan.');
                return;
            }

            showLoading('MENGIRIM KE SPREADSHEET');

            fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                const selectedText = SELECTED_PENS.join(', ');

                // Tambahkan hitungan input untuk pen terpilih
                SELECTED_PENS.forEach(p => {
                    const key = `${p}-${shift}`;
                    if (!COUNTER_JOBS[key]) {
                        COUNTER_JOBS[key] = 0;
                    }
                    COUNTER_JOBS[key] += 1;
                });

                finishLoading(() => {
                    alert(`Sukses! Penimbangan gabungan untuk pen [${selectedText}] berhasil disimpan.`);
                    resetSelectionAndRender();
                });
            })
            .catch(err => {
                alert('Terjadi kesalahan saat mengirim data ke spreadsheet!');
                finishLoading();
            });
        }
    </script>
</body>
</html>
